name: Deploy to Netlify

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: npm ci && npm run build

      - name: Deploy via Netlify CLI (token)
        if: ${{ secrets.NETLIFY_AUTH_TOKEN != '' }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: npx netlify-cli deploy --prod --dir=dist --site=cc538477-6a12-4b0f-b45d-781318e15f7b --message "GitHub Actions deploy"

      - name: Trigger Netlify build hook
        if: ${{ secrets.NETLIFY_AUTH_TOKEN == '' && secrets.NETLIFY_BUILD_HOOK != '' }}
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          curl -fsS -X POST -d '{}' \
            "${NETLIFY_BUILD_HOOK}?trigger_branch=main&trigger_title=GitHub%20Actions%20hook%20deploy&clear_cache=true"

      - name: Netlify credentials missing
        if: ${{ secrets.NETLIFY_AUTH_TOKEN == '' && secrets.NETLIFY_BUILD_HOOK == '' }}
        run: |
          echo "::warning::Skipping Netlify deploy — add NETLIFY_AUTH_TOKEN or NETLIFY_BUILD_HOOK to GitHub secrets."
          echo "GitHub Pages deploy may still publish the app if that workflow is enabled."
